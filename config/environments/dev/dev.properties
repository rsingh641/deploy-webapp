# Infrastructure configs
ENV="dev"
LOCATION="eastus"
RESOURCE_GROUP="rg-${ENV}"
VNET_NAME="vnet-${ENV}"

ENABLE_SUBNET_CREATION="true"
WEBSERVICE_SUBNET_NAME="webservice-subnet-${ENV}"
WEBSERVICE_SUBNET_PREFIX="10.1.0.0/24"
WEBSERVICE_RUNTIME_SUBNET_NAME="webservice-runtime-subnet-${ENV}"
WEBSERVICE_RUNTIME_SUBNET_PREFIX="10.1.1.0/24"
WEBSERVICE_INFRA_RESOURCE_GROUP="rg-infra-${ENV}"
UI_SUBNET_NAME="ui-subnet-${ENV}"
UI_SUBNET_PREFIX="10.1.0.0/24"

KEY_VAULT_NAME="kv-${ENV}"
ENABLE_APP_INSIGHTS="false"
APP_INSIGHTS_NAME="app-insights-${ENV}"
APP_INSIGHTS_SAMPLING_RATE=30

#------------------------------
# Webservice configs

WEBSERVICE_SKU="Basic"
WEBSERVICE_ZONE_REDUNDANT="false"
SPRING_APP_SERVICE="spring-apps-${ENV}"
APP_SERVICE_PLAN="app_service_${ENV}"
SPRING_APP_NAME="spring-apps-${ENV}"
SPRING_APP_CPU=500m
SPRING_APP_MEMORY=512Mi
SPRING_APP_INSTANCE_COUNT=1
SPRING_APP_PUBLIC_ENDPOINT="false"
SPRING_APP_DEPLOYMENT_NAME="webservice-${ENV}"
SPRING_APP_DISABLE_PROBE="true"
SPRING_APP_ENABLE_LIVNESS_PROBE="true"
SPRING_APP_ENABLE_STARTUP_PROBE="true"
SPRING_APP_ENABLE_READINESS_PROBE="true"


WEBSERVICE_SKU="B1"
WEBAPP_NAME="webservice_${ENV}"
JAVA_VERSION="Java_11"
RUNTIME="JAVA|11-java11"
NODE_VERSION="14.0"


#----------------------------------
# Artifact configs

ARTIFACT_FEED_NAME="ArtifactFeed_${ENV}"
ARTIFACT_PACKAGE_NAME="AppPackage_${ENV}"
ARTIFACT_VERSION="1.0.0"
ARTIFACT_URL="https://pkgs.${ENV}.azure.com/${ORG_NAME}/${PROJECT_NAME}/_artifacts/feed/${ARTIFACT_FEED_NAME}"

